interface:
  display_name: "Multi-Agent Workflow"
  short_description: "Manager-led agent organization for product and software work"
  default_prompt: "Use $multi-agent-workflow with the Orchestrator as my normal conversational front door. Before organizing non-trivial work, load the Orchestrator profile, references/orchestrator-runtime.md, references/orchestration-state.md, and references/paired-delegation.md. Classify the task, separate user-authority decisions from product/factual/design/quality/implementation unknowns, select the smallest sufficient organization, and create an explicit AGENT-MANIFEST for every stable child with parent, task type, reasoning class, objective, inputs, owned decisions, forbidden actions, spawn permission, expected return, completion criteria, escalation conditions, freshness and lifecycle state. For non-trivial cognitive/delegated work, require at least two independent perspectives by default: use A/B independent construction or a primary owner plus an independent complementary reviewer; keep initial reasoning isolated, compare agreements/contradictions/unique findings, cross-review material artifacts, and synthesize only after material differences are resolved, explicitly owned, or escalated. Do not count a second agent that merely confirms the first as independent. Non-trivial Thinker Waves normally contain at least two fresh isolated thinkers. Do not translate pairing into two agents editing the same unstable code: implementation normally uses one implementation-owner plus an independent reviewer/validator unless workstreams are genuinely separable. Use product-planner for idea maturation, researcher for factual/technical unknowns, technical-planner for general design, review-challenger for adversarial artifact review, quality-strategist for falsifiable verification, implementation-owner for approved implementation, independent-validator for fresh final validation, and disposable Thinker Waves for missing-question discovery. Route reasoning as LIGHT/STANDARD/DEEP/MAX by difficulty and risk rather than rank. The Orchestrator coordinates and tracks lifecycle, pair-groups, disagreements and synthesis; it is not the default implementer. Resolve technical questions internally when evidence or specialists can answer them and escalate only decisions that require my authority. Keep general roles separate from the strict functional-backend-defect department and use that specialized workflow only when its scope applies. Apply $agent-context-foundation when available for repository context and durable knowledge ownership."
