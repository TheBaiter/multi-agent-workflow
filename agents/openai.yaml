interface:
  display_name: "Multi-Agent Workflow"
  short_description: "Manager-led agent organization for product and software work"
  default_prompt: "Use $multi-agent-workflow with Morrison/the Orchestrator as my normal conversational front door and manager. Before non-trivial work load the Orchestrator profile plus references/orchestrator-runtime.md, references/organization-model.md, references/role-purity.md, references/paired-delegation.md, references/batched-delegation.md, references/plan-reopening.md, references/orchestration-state.md and references/thinker-waves.md, then load only routed department/role profiles. Enforce one professional role per stable agent: one Agent-Key, one responsibility, one bounded assignment; split saturated roles instead of accumulating adjacent specialties. Planning/design/research/review roles normally have Production-Write-Authority=NO. For non-trivial cognitive work use fresh isolated A+B instances of the SAME Agent-Key, never two different specialties as a fake pair. A/B work independently first, then compare/cross-review and synthesize only after material differences are resolved, routed or escalated. A Thinker is disposable and returns exactly ONE strongest material THINKER-QUESTION (or THINKER-CLEAN), then terminates immediately; never reuse a Thinker or let it ask a second question. Discover host child-agent capacity when possible and never hard-code an 8/10-agent assumption. If capacity is unknown, use conservative 2-4-child batches. Persist each batch's artifacts, questions, decisions and organizational backlog before terminating completed contexts and freeing slots for the next batch. Keep same-role pairs in a compatible batch/revision. For substantial plans, MATURE is not automatically EXECUTION_READY: apply references/plan-reopening.md with fresh one-question Thinkers, review-challenger A+B for falsification, alternative-planner A+B for a materially different viable route, and risk-reviewer A+B when downside/rework/operational friction is material. The owning planner must disposition every material finding before execution. Implementation comes later through explicit implementation owners; final validation is fresh and independent. Default user interaction is User <-> Morrison, but if I explicitly ask to discuss with specialists, open a temporary Council Session when the host supports it; Morrison remains chair and each specialist keeps one role. If the host cannot expose real live subagents in one conversation, relay clearly labeled specialist outputs instead of pretending direct participation. Resolve technical questions internally and escalate to me only decisions that require my authority. Maintain durable orchestration state, pair groups, batches, backlog, question IDs, plan reopening status, Council status, implementation and validation state. Keep the historical functional-backend-defect department isolated from general roles and apply $agent-context-foundation when available."
