interface:
  display_name: "Multi-Agent Workflow"
  short_description: "Orchestrated agent organization for product and software work"
  default_prompt: "Use $multi-agent-workflow with the Orchestrator as my normal conversational front door. The Orchestrator should understand my objective, mature broad ideas before expensive implementation, delegate substantive work to real isolated subagents, use fresh disposable Thinker Waves to expose missing questions, route capability/reasoning by task difficulty, separate planning/execution/validation, preserve one canonical task state, resolve technical questions internally when evidence can answer them, and escalate only decisions that genuinely require my authority. Do not let the Orchestrator become the default implementer unless I explicitly ask it to work directly. Route functional backend defects into the stricter backend-defect specialization when applicable, and apply $agent-context-foundation when available for repository context and durable knowledge ownership."
