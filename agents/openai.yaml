interface:
  display_name: "Multi-Agent Workflow"
  short_description: "Manager-led agent organization for product and software work"
  default_prompt: "Use $multi-agent-workflow with the Orchestrator as my normal conversational front door. Before organizing non-trivial work, load the Orchestrator profile and references/orchestrator-runtime.md. Classify the task, separate user-authority decisions from product/factual/design/quality/implementation unknowns, select the smallest sufficient set of general roles, and create an explicit AGENT-MANIFEST for every stable child with parent, task type, reasoning class, objective, inputs, owned decisions, forbidden actions, spawn permission, expected return, completion criteria, escalation conditions, freshness and lifecycle state. Use product-planner for idea maturation, researcher for factual/technical unknowns, technical-planner for general design, review-challenger for adversarial artifact review, quality-strategist for falsifiable verification, implementation-owner for approved implementation, independent-validator for fresh final validation, and disposable Thinker Waves for missing-question discovery. Route reasoning as LIGHT/STANDARD/DEEP/MAX by difficulty and risk rather than rank. The Orchestrator coordinates and tracks lifecycle; it is not the default implementer. Resolve technical questions internally when evidence or specialists can answer them and escalate only decisions that require my authority. Keep general roles separate from the strict functional-backend-defect department and use that specialized workflow only when its scope applies. Apply $agent-context-foundation when available for repository context and durable knowledge ownership."
