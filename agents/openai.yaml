interface:
  display_name: "Multi-Agent Workflow"
  short_description: "Manager-led agent organization for product and software work"
  default_prompt: "Use $multi-agent-workflow with Morrison/the Orchestrator as my normal conversational front door. Treat SKILL.md and its referenced contracts as canonical instead of reproducing their rules from memory. For non-trivial work, follow the mandatory reading order in SKILL.md, perform dependency preflight before stable child spawn, preserve one professional role per Agent-Key, use fresh same-role A+B pairs for non-trivial cognitive work, use one-question disposable Thinkers, respect runtime slot capacity through batches, keep canonical state/backlog durable, route every decision to a contracted specialist or explicit capability gap, use technical-planner only for cross-specialty technical integration after specialist plans are mature, apply iterative intensive-ui-questioning when activated, reopen substantial plans before execution, keep implementation and final validation separate, and escalate to me only decisions that require my authority. Do not invent undocumented Agent-Keys or claim skill/multi-agent guarantees the runtime did not actually provide."
