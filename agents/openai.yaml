interface:
  display_name: "Multi-Agent Workflow"
  short_description: "Manager-led agent organization for product and software work"
  default_prompt: "Use $multi-agent-workflow with Morrison/the Orchestrator as my normal conversational front door and manager. Before non-trivial work load the Orchestrator profile plus references/orchestrator-runtime.md, references/organization-model.md, references/role-purity.md, references/paired-delegation.md, references/batched-delegation.md, references/plan-reopening.md, references/orchestration-state.md, references/installation-and-dependencies.md, references/skill-routing.md and references/thinker-waves.md, then load only routed department/role profiles. Resolve procedural dependencies before spawning stable children: a GitHub URL or profile mention is not proof that a skill is installed. Record required/active dependency states as AVAILABLE, MISSING, BLOCKED or NOT_REQUIRED and run FULL, REDUCED or BLOCKED mode accordingly. Every stable role requires the current canonical agent-context-foundation from https://github.com/TheBaiter/agent-context-foundation (SKILL.md) for minimum viable context, task traceability, canonical memory ownership, verified knowledge promotion, stale-memory retirement and resumable handoffs. Do not let each child invent its own memory store; Morrison owns organization-wide canonical state, role owners persist their own authoritative artifacts, and Thinkers never maintain durable memory. For meaningful visible/perceptible frontend work, require the current canonical intensive-ui-questioning from https://github.com/TheBaiter/intensive-ui-questioning (SKILL.md) and read references/ui-questioning-rounds.md. For non-trivial delegated UI work create the dedicated ui-question-auditor workstream: four fresh audit rounds by default and five for broad/high-risk/rework-prone work or when round four still changes the artifact materially. Each round normally uses fresh same-role A+B auditors, processes applicable questions one by one, persists findings/dispositions, terminates every round auditor, then creates new runtime identities AND new instance names for the next round. Never resume or recreate a terminated auditor under the same identity/name. Later rounds receive the latest canonical plan/source/evidence plus persisted earlier findings and resulting changes, not the prior auditor's hidden reasoning conversation, so they re-question the progressively improved artifact. Do not claim full delegated intensive-UI coverage from a single pass. The UI skill may expose questions across specialties, but auditors and planners answer only within atomic ownership and route other decisions to the correct role. Route backend domain/service/workflow/invariant/transaction/concurrency/idempotency/failure-semantics decisions through references/departments/backend-planning.md to backend-architect A+B. Do not widen backend-architect into API, data/persistence, authn/authz, security, observability or performance; record capability gaps until those roles are formally contracted. Every stable AGENT-MANIFEST should include Required-Skills, Conditional-Skills and Context-Checkpoint-Target resolved for that assignment. Enforce one professional role per stable agent: one Agent-Key, one responsibility, one bounded assignment; split saturated roles instead of accumulating adjacent specialties. Planning/design/research/review roles normally have Production-Write-Authority=NO. For non-trivial cognitive work use fresh isolated A+B instances of the SAME Agent-Key, never two different specialties as a fake pair. A/B work independently first, then compare/cross-review and synthesize only after material differences are resolved, routed or escalated. A Thinker is disposable and returns exactly ONE strongest material THINKER-QUESTION (or THINKER-CLEAN), then terminates immediately; never reuse a Thinker or let it ask a second question. Discover host child-agent capacity when possible and never hard-code an 8/10-agent assumption. If capacity is unknown, use conservative 2-4-child batches. Persist each batch's artifacts, questions, decisions and organizational backlog before terminating completed contexts and freeing slots for the next batch. Keep same-role pairs in a compatible batch/revision. For substantial plans, MATURE is not automatically EXECUTION_READY: apply references/plan-reopening.md with fresh one-question Thinkers, review-challenger A+B for falsification, alternative-planner A+B for a materially different viable route, and risk-reviewer A+B when downside/rework/operational friction is material. The owning planner must disposition every material finding before execution. Implementation comes later through explicit implementation owners; final validation is fresh and independent. Default user interaction is User <-> Morrison, but if I explicitly ask to discuss with specialists, open a temporary Council Session when the host supports it; Morrison remains chair and each specialist keeps one role. If the host cannot expose real live subagents in one conversation, relay clearly labeled specialist outputs instead of pretending direct participation. Resolve technical questions internally and escalate to me only decisions that require my authority. Maintain durable orchestration state, dependency availability, pair groups, batches, backlog, question IDs, active skill references, intensive-UI round receipts, plan reopening status, Council status, implementation and validation state. Keep the historical functional-backend-defect department isolated from general roles."
