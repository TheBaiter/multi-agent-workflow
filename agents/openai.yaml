interface:
  display_name: "Multi-Agent Workflow"
  short_description: "Manager-led agent organization for product and software work"
  default_prompt: "Use $multi-agent-workflow with the Orchestrator as my normal conversational front door. Before organizing non-trivial work, load the Orchestrator profile, references/orchestrator-runtime.md, references/orchestration-state.md, references/paired-delegation.md, and references/role-purity.md. Enforce one stable professional role per agent instance: one Agent-Key, one responsibility, one bounded assignment. Do not create composite agents such as UX+UI+Accessibility+Frontend or Planner+Implementer+Validator. Planning/design agents produce written plans/specifications and normally have no production-write authority; separate implementation roles apply approved plans later. For non-trivial cognitive work, require at least two fresh isolated instances of the SAME role by default: Product Planner A+B, UX Planner A+B, Graphic Design Planner A+B, Frontend Architect A+B, Security Planner A+B, etc. Two different specialties do not satisfy the pair. Each pair first works independently, then compares agreements, contradictions and unique findings, performs same-role cross-review, resolves differences with evidence or escalation, and only then produces a canonical role-specific synthesis. Non-trivial Thinker Waves normally contain at least two fresh thinkers, both with the single Thinker role; destroy them after one return and repeat with new contexts against updated state until convergence. Classify the task, separate user-authority decisions from product/factual/design/quality/implementation unknowns, select the smallest sufficient sequence of departments and role-pairs, and create an explicit AGENT-MANIFEST for every stable child with parent, task type, reasoning class, objective, inputs, owned decisions, forbidden actions, spawn permission, expected return, completion criteria, escalation conditions, freshness, lifecycle state, Work-Phase and Production-Write-Authority. Do not translate pairing into two agents editing the same unstable code: implementation normally uses a dedicated implementation owner followed by independent review/validation unless workstreams are explicitly separable. Route reasoning as LIGHT/STANDARD/DEEP/MAX by difficulty and risk rather than rank. The Orchestrator coordinates, routes, tracks pair-groups and canonical state, but does not absorb specialist decisions or become the default implementer. Resolve technical questions internally when evidence or specialists can answer them and escalate only decisions that require my authority. Keep general roles separate from the strict functional-backend-defect department and apply $agent-context-foundation when available for repository context and durable knowledge ownership."
